<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luísa Costa — Game Designer</title>
<meta name="description" content="Portfolio of Luísa Costa, game designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- YouTube's real UI font is Roboto -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!--
  ============================================================
  PAGE WRAPPER
  This wrapper gets a "blurred" class added by script.js
  whenever a project popup is open, so the whole page blurs
  behind it. Everything visible on the page (banner, channel
  info, video grid) lives inside it.
  ============================================================
-->
<div id="page" class="page">

  <!-- ============ BANNER ============
       Swap the <img src=""> below to change this image. -->
  <div class="banner">
    <img src="https://luisadesigns.carrd.co/assets/images/image04.jpg?v=a2f84e48" alt="" class="banner-img">
  </div>

  <!-- ============ CHANNEL HEADER ============ -->
  <div class="channel-header">

    <img class="avatar" src="https://luisadesigns.carrd.co/assets/images/image01.jpg?v=a2f84e48" alt="Luísa Costa">

    <div class="channel-info">
      <h1 class="channel-name">Luísa Costa</h1>
      <!-- The number below is filled in automatically by script.js —
           it counts how many .card thumbnails are in the grid, so it
           always matches without you having to update it by hand. -->
      <p class="channel-meta">@luisacosta&nbsp;&middot;&nbsp;<span id="project-count">3</span> projects</p>
      <p class="channel-bio">Game designer crafting mechanic-driven levels and adaptive systems.</p>

      <!--
        These two buttons replace YouTube's "Customise channel" /
        "Manage videos" buttons. Just change the href="" values
        below to point wherever you like.
      -->
      <div class="channel-buttons">
        <a class="btn" href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn" href="cv.pdf" target="_blank" rel="noopener">CV</a>
      </div>
    </div>
  </div>

  <!-- ============ TABS (decorative, matches the YouTube look) ============ -->
  <div class="tabs">
    <span class="tab tab-active">Home</span>
    <span class="tab">About</span>
  </div>
  <hr class="divider">

  <!-- ============================================================
       VIDEO-STYLE GRID
       Each .card below is one project "thumbnail". Clicking it
       opens the <template> with the matching id (see the
       "POPUP CONTENT TEMPLATES" section further down) inside
       the popup.
       ============================================================ -->

  <!--
    ==========================================================================
    HOW TO ADD A NEW PROJECT

    1. Copy everything between the "COPY FROM HERE" and "COPY TO HERE"
       markers below (the card AND its template together).
    2. Paste it inside the .grid <div> further down, right before its
       closing </div>.
    3. Delete the <!== and ==> marks around this whole block (just this
       one, not the copied part) so it stops being a comment.
    4. Give the pasted card and template matching ids, e.g. "modal-4",
       and update the text, image URLs, and badge label.

    ==== COPY FROM HERE ====

    <button class="card" data-modal="modal-4">
      <div class="thumb-wrap">
        <img class="thumb" src="PASTE-THUMBNAIL-IMAGE-URL-HERE.jpg" alt="Project name thumbnail">
        <span class="thumb-badge">LEVEL 04</span>
      </div>
      <div class="card-info">
        <p class="card-title">Project Name</p>
        <p class="card-meta">Solo project</p>
      </div>
    </button>

    <template id="modal-4">
      <h3 class="modal-title">Project Name</h3>
      <p class="modal-badge">Solo project</p>

      <img class="modal-media" src="PASTE-MAIN-IMAGE-URL-HERE.jpg" alt="Describe this image">

      <p class="modal-desc">Write the full project description here. This can be as long as you want, the popup scrolls.</p>

      (to add another image, copy this line as many times as you like)
      <img class="modal-media" src="PASTE-ANOTHER-IMAGE-URL-HERE.jpg" alt="Describe this image">

      (to add a video, copy this block)
      <video class="modal-media" controls>
        <source src="PASTE-VIDEO-URL-HERE.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      (to embed a YouTube video, copy this block — get the ID from
      the video's normal watch link: youtube.com/watch?v=THIS_PART)
      <div class="modal-video-wrap">
        <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>

      (to add another paragraph, copy this line)
      <p class="modal-desc">Another paragraph goes here.</p>

      (to add a link — itch.io, GitHub, YouTube, etc — copy this line)
      <a class="modal-link" href="PASTE-URL-HERE" target="_blank" rel="noopener">Link text</a>
    </template>

    ==== COPY TO HERE ====
    ==========================================================================
  -->

  <h2 class="section-title">Projects</h2>

  <div class="grid">

    <!-- PROJECT 1 -->
    <button class="card" data-modal="modal-1">
      <div class="thumb-wrap">
        <img class="thumb" src="https://luisadesigns.carrd.co/assets/images/image03.jpg?v=a2f84e48" alt="Adaptative Game Design thumbnail">
        <span class="thumb-badge">LEVEL 01</span>
      </div>
      <div class="card-info">
        <p class="card-title">Adaptative Game Design</p>
        <p class="card-meta">University project</p>
      </div>
    </button>

    <!-- PROJECT 2 -->
    <button class="card" data-modal="modal-2">
      <div class="thumb-wrap">
        <img class="thumb" src="https://luisadesigns.carrd.co/assets/images/image04.jpg?v=a2f84e48" alt="2D Platformer thumbnail">
        <span class="thumb-badge">LEVEL 02</span>
      </div>
      <div class="card-info">
        <p class="card-title">2D Platformer</p>
        <p class="card-meta">Solo project · Unity</p>
      </div>
    </button>

    <!-- PROJECT 3 -->
    <button class="card" data-modal="modal-3">
      <div class="thumb-wrap">
        <img class="thumb" src="https://luisadesigns.carrd.co/assets/images/image02.jpg?v=a2f84e48" alt="Timing / Puzzle Level thumbnail">
        <span class="thumb-badge">LEVEL 03</span>
      </div>
      <div class="card-info">
        <p class="card-title">Timing / Puzzle Level</p>
        <p class="card-meta">Solo project</p>
      </div>
    </button>

  </div>

</div><!-- /#page -->


<!-- ============================================================
     POPUP CONTENT TEMPLATES
     One <template> per project, matching each card's data-modal
     id. Nothing inside a <template> is visible on the page —
     script.js clones it into the popup when its card is clicked.

     Feel free to add as much as you want inside each one:
       <img class="modal-media" src="..." alt="...">
       <video class="modal-media" controls><source src="..." type="video/mp4"></video>
       <p class="modal-desc">...</p>
       <a class="modal-link" href="..." target="_blank" rel="noopener">Link text</a>
     The popup scrolls internally, so there's no length limit.
     ============================================================ -->

<template id="modal-1">
  <h3 class="modal-title">Adaptative Game Design</h3>
  <p class="modal-badge">University project</p>

  <img class="modal-media" src="https://luisadesigns.carrd.co/assets/images/image03.jpg?v=a2f84e48" alt="Adaptive Game Design concept visual">

  <p class="modal-desc">This university project explores a conceptual adaptive system for horror games in which biometric data is used to dynamically adjust gameplay mechanics and user interface elements. By interpreting the player's physiological responses, the game can balance moments of high tension and relief, creating a personalized and immersive horror experience while keeping the narrative unchanged.</p>

  <!--
    Placeholders — copy any of these lines/blocks into this
    template (above this comment) to add more content:

    <img class="modal-media" src="PASTE-IMAGE-URL-HERE.jpg" alt="Describe this image">

    <video class="modal-media" controls>
      <source src="PASTE-VIDEO-URL-HERE.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="modal-video-wrap">
      <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <p class="modal-desc">Another paragraph goes here.</p>

    <a class="modal-link" href="PASTE-URL-HERE" target="_blank" rel="noopener">Link text</a>
  -->
</template>

<template id="modal-2">
  <h3 class="modal-title">2D Platformer</h3>
  <p class="modal-badge">Solo project · Unity</p>

  <img class="modal-media" src="https://luisadesigns.carrd.co/assets/images/image04.jpg?v=a2f84e48" alt="2D Platformer overview">

  <p class="modal-desc">The level is divided into three sequential sections. Base movement mechanics (jump and air dash) are introduced in isolation, followed by magnetic push/pull interactions and timed hazards. Each section reuses previously introduced mechanics while increasing spatial complexity, timing constraints, and interaction density.</p>

  <p class="modal-desc">The design process focused on mechanic clarity, repetition with variation, and gradual escalation, allowing players to learn through layout structure rather than explicit instruction. Visual assets used are free assets sourced from the Unity Asset Store and other free asset libraries.</p>

  <img class="modal-media" src="https://luisadesigns.carrd.co/assets/images/image06.jpg?v=a2f84e48" alt="Platformer layout part 1">
  <img class="modal-media" src="https://luisadesigns.carrd.co/assets/images/image07.jpg?v=a2f84e48" alt="Platformer layout part 2">
  <img class="modal-media" src="https://luisadesigns.carrd.co/assets/images/image08.jpg?v=a2f84e48" alt="Platformer layout part 3">
  <img class="modal-media" src="https://luisadesigns.carrd.co/assets/images/image05.jpg?v=a2f84e48" alt="Platformer layout part 4">

  <!--
    YOUTUBE VIDEO — how to fill this in:
    1. On the YouTube video's page, click Share -> Embed, and copy the
       video ID out of the URL it gives you (or just take the ID from
       a normal watch link: https://www.youtube.com/watch?v=THIS_PART).
    2. Replace YOUR_VIDEO_ID_HERE below with that ID.
    That's it — the box below already has the right size/shape, it
    just needs a real ID to actually show a video.
  -->
  <div class="modal-video-wrap">
    <iframe
      src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <!--
    Placeholders — copy any of these lines/blocks into this
    template (above this comment) to add more content:

    <img class="modal-media" src="PASTE-IMAGE-URL-HERE.jpg" alt="Describe this image">

    <video class="modal-media" controls>
      <source src="PASTE-VIDEO-URL-HERE.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="modal-video-wrap">
      <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <p class="modal-desc">Another paragraph goes here.</p>

    <a class="modal-link" href="PASTE-URL-HERE" target="_blank" rel="noopener">Link text</a>
  -->
</template>

<template id="modal-3">
  <h3 class="modal-title">Timing / Puzzle Level</h3>
  <p class="modal-badge">Solo project</p>

  <img class="modal-media" src="https://luisadesigns.carrd.co/assets/images/image02.jpg?v=a2f84e48" alt="Timing puzzle level layout">

  <p class="modal-desc">This consists of two simple levels. The player can jump, push buttons and boxes to trigger specific mechanics in the level. To get through the levels, the player will have to study and master the timings.</p>

  <p class="modal-desc">The designing process of these levels started with showing the mechanics in the first level and then making it more complicated for the second level, while adding something more to keep the play dynamic.</p>

  <!--
    Placeholders — copy any of these lines/blocks into this
    template (above this comment) to add more content:

    <img class="modal-media" src="PASTE-IMAGE-URL-HERE.jpg" alt="Describe this image">

    <video class="modal-media" controls>
      <source src="PASTE-VIDEO-URL-HERE.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="modal-video-wrap">
      <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <p class="modal-desc">Another paragraph goes here.</p>

    <a class="modal-link" href="PASTE-URL-HERE" target="_blank" rel="noopener">Link text</a>
  -->
</template>


<!-- ============================================================
     PROJECT POPUP (shell)
     Hidden by default. script.js empties #modal-scroll, clones
     the matching <template> into it, and shows this overlay.
     ============================================================ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div class="modal-scroll" id="modal-scroll">
      <!-- Cloned <template> content gets inserted here by script.js -->
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
